<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Montaza Palace 实景照片下载器</title><style>body{font-family:system-ui,sans-serif;max-width:780px;margin:40px auto;padding:0 20px;background:#f5efe3;color:#073f45}main{background:#fff;padding:28px;border-radius:22px;box-shadow:0 12px 40px #0001}button{border:0;border-radius:12px;padding:14px 20px;background:#073f45;color:white;font-weight:800;cursor:pointer}li{margin:10px 0}code{background:#f1e7d6;padding:2px 6px;border-radius:6px}#log{white-space:pre-wrap;margin-top:18px}</style></head><body><main><h1>Montaza Palace / قصر المنتزه 实景照片</h1><p>点击后从 Wikimedia Commons 下载 4 张已核实授权的真实照片，并在浏览器中生成 <code>montaza-palace-real-photos.zip</code>。解压后把 JPG 放入项目 <code>public/images/</code>。</p><ul><li>montaza-palace-hero.jpg</li><li>montaza-palace-main.jpg</li><li>montaza-palace-garden.jpg</li><li>montaza-palace-coast.jpg</li></ul><button id="go">下载并生成照片 ZIP</button><div id="log">等待开始…</div></main><script>
const files=[
['montaza-palace-hero.jpg','https://upload.wikimedia.org/wikipedia/commons/9/93/Montazah_Palace_and_Gardens.jpg'],
['montaza-palace-main.jpg','https://upload.wikimedia.org/wikipedia/commons/f/f1/Montaza_Palace_-_ALEXANDRIA.jpg'],
['montaza-palace-garden.jpg','https://upload.wikimedia.org/wikipedia/commons/b/b2/Montaza_Palace_garden_001.JPG'],
['montaza-palace-coast.jpg','https://upload.wikimedia.org/wikipedia/commons/8/80/Montaza_Palace%2C_Alexandria.jpg']];
const enc=new TextEncoder();let crcTable;
function makeCrcTable(){const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;}
function crc32(bytes){crcTable||=makeCrcTable();let c=0xffffffff;for(const b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0;}
function u16(v){const a=new Uint8Array(2);new DataView(a.buffer).setUint16(0,v,true);return a}function u32(v){const a=new Uint8Array(4);new DataView(a.buffer).setUint32(0,v>>>0,true);return a}
function concat(parts){let n=0;for(const p of parts)n+=p.length;const out=new Uint8Array(n);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out}
function zipStore(items){const locals=[],centrals=[];let offset=0;for(const item of items){const name=enc.encode(item.name),data=item.data,crc=crc32(data);const local=concat([u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);locals.push(local);const central=concat([u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);centrals.push(central);offset+=local.length;}const lb=concat(locals),cb=concat(centrals);const end=concat([u32(0x06054b50),u16(0),u16(0),u16(items.length),u16(items.length),u32(cb.length),u32(lb.length),u16(0)]);return new Blob([lb,cb,end],{type:'application/zip'});}
const log=document.getElementById('log');document.getElementById('go').onclick=async()=>{const btn=document.getElementById('go');btn.disabled=true;try{const items=[];for(const [name,url] of files){log.textContent=`正在下载 ${name}…`;const r=await fetch(url);if(!r.ok)throw new Error(`${name}: HTTP ${r.status}`);items.push({name,data:new Uint8Array(await r.arrayBuffer())});}log.textContent='正在生成 ZIP…';const blob=zipStore(items);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='montaza-palace-real-photos.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);log.textContent='完成。请将 4 张 JPG 放到 public/images/。';}catch(e){log.textContent='失败：'+e.message+'\n如果浏览器阻止跨域请求，可直接按 PHOTO-SOURCES.md 中的原图链接手动保存。';}finally{btn.disabled=false;}};
</script></body></html>
